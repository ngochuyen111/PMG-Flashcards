<head>
<meta charset="UTF-8">

<title>PMG — 279 Flashcards</title>

<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--primary:#4f46e5;--primary2:#7c3aed;--border:#e2e8f0;--good:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:var(--text);min-height:100vh}
.app{max-width:1050px;margin:auto;padding:25px 18px 45px}
header{text-align:center;margin-bottom:18px}
h1{margin:0 0 6px;font-size:clamp(25px,5vw,40px)}
.subtitle{margin:0;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:18px 0}
button,input{font:inherit}
button{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:700}
button.primary{background:var(--primary);color:#fff} button.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
button:hover{transform:translateY(-1px)}
.search{width:min(430px,100%);padding:12px 15px;border:1px solid var(--border);border-radius:12px;background:#fff;outline:none}
.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0 20px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0;transition:.25s}
.counter{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px}
.scene{perspective:1400px;min-height:520px}
.card{position:relative;width:100%;min-height:520px;transform-style:preserve-3d;transition:transform .55s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 18px 55px rgba(15,23,42,.10);padding:32px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.back{transform:rotateY(180deg);background:linear-gradient(145deg,#fff,#f5f3ff)}
.badge{display:inline-flex;align-self:center;padding:7px 11px;border-radius:999px;background:#eef2ff;color:var(--primary);font-weight:800;font-size:13px;margin-bottom:16px}
.qtext{font-size:clamp(19px,2.5vw,27px);line-height:1.45;margin:0 0 20px}
.options{display:flex;flex-direction:column;gap:10px}
.option{padding:12px 15px;border:1px solid var(--border);border-radius:12px;background:#f8fafc;line-height:1.45;font-size:clamp(15px,1.8vw,18px)}
.option b{display:inline-block;min-width:26px}
.answer-title{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center;margin-bottom:12px;font-weight:800}
.answer{font-size:clamp(21px,3vw,31px);line-height:1.5;text-align:center;font-weight:800;color:var(--good)}
.hint{text-align:center;color:var(--muted);margin-top:16px;font-size:14px}
.nav{display:flex;justify-content:center;gap:12px;margin:20px 0}
.nav button{min-width:120px}
.info{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px 17px;color:var(--muted);font-size:14px;text-align:center}
kbd{background:#f3f4f6;border:1px solid #d1d5db;border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:#374151}
@media(max-width:600px){.face{padding:22px;min-height:430px}.card,.scene{min-height:430px}.nav button{min-width:90px}}
@media print{body{background:#fff}.toolbar,.nav,.info,.progress,.counter,.hint{display:none}.scene{min-height:auto}.card{transform:none!important;min-height:400px}.back{display:none}.face{position:relative;box-shadow:none}}
</style>
</head>

<script>
const QUESTIONS = [{"n": 1, "q": "A project is plagued by requested changes to the project charter. Who has the primary responsibility to decide if these changes are necessary?", "options": [["A", "The project manager"], ["B", "The project team"], ["C", "The sponsor"], ["D", "The stakeholders"]], "answer": "C", "answer_text": "C. The sponsor"}, {"n": 2, "q": "In Earned Value Management Technique, you can compute the Cost Performance Index (CPI) by apply- ing which of following formula?", "options": [["A", "CPI = EV / PV"], ["B", "CPI = EV - AC"], ["C", "CPI = EV - PV"], ["D", "CPI = EV / AC"]], "answer": "D", "answer_text": "D. CPI = EV / AC"}, {"n": 3, "q": "True or False: Project manager should consider using milestones for high level reporting", "options": [["A", "True"], ["B", "False"]], "answer": "A", "answer_text": "A. True"}, {"n": 4, "q": "True or False: Project scope statement is better to define inclusions (in-scope items) than identify only exclusions (out of scope items).", "options": [["A", "False"], ["B", "True"]], "answer": "B", "answer_text": "B. True"}, {"n": 5, "q": "Which one is NOT the approach to shorten your pro- ject schedule?", "options": [["A", "Fast Tracking"], ["B", "Crashing"], ["C", "Reducing"]], "answer": "C", "answer_text": "C. Reducing"}, {"n": 6, "q": "A market demand, a business need, and a legal re- quirement are examples of:", "options": [["A", "Reasons to hire a project manager"], ["B", "Reasons projects are initiated"], ["C", "Reasons to sponsor a project"], ["D", "Reasons people or businesses become stakehold- ers"]], "answer": "B", "answer_text": "B. Reasons projects are initiated"}, {"n": 7, "q": "You have finished planning and have begun executing the project when the client asks if you would shorten the project duration so that the project can finish 2 weeks earlier than the original plan. How are the triple constraints affected?", "options": [["A", "There is no relevant option except the project must be cut down on scope"], ["B", "Scope and cost may both be affected"], ["C", "Neither scope nor cost will be affected in any situa- tion"], ["D", "Cost will reduce as the project duration is shortened and scope is not changed"]], "answer": "B", "answer_text": "B. Scope and cost may both be affected"}, {"n": 8, "q": "You are assigned as the project manager in the middle of the project. The project is within the baselines, but the customer is not happy with the performance of the project. What is the first thing you should do?", "options": [["A", "Discuss it with the project team"], ["B", "Recalculate baselines"], ["C", "Renegotiate the contract"], ["D", "Meet with the customer"]], "answer": "D", "answer_text": "D. Meet with the customer"}, {"n": 9, "q": "In our lessons the acronym RAM stands for:", "options": [["A", "Responsible Accountable Manageable"], ["C", "Responsibility Assign- ment Matrix"], ["B", "Resource Aligned Management"], ["D", "Responsibility Accountability Matrix"], ["E", "Resource Acquisition Management"]], "answer": "C", "answer_text": "C. Responsibility Assign- ment Matrix"}, {"n": 10, "q": "When you report project status you compare actual performance to:", "options": [["A", "The planned performance or baseline."], ["B", "The performance of your competitors."], ["C", "The performance of previous projects."], ["D", "The performance of other similar projects."]], "answer": "A", "answer_text": "A. The planned performance or baseline."}, {"n": 11, "q": "Which organization structure can provide the most power for the project manager?", "options": [["A", "Functional"], ["B", "Weak Matrix"], ["C", "Balanced Matrix"], ["D", "Strongest Matrix E Projectized"], ["F", "Medium Matrix"]], "answer": "E", "answer_text": "E"}, {"n": 12, "q": "Which project management process group generally takes the most project time and resources?", "options": [["A", "Executing"], ["B", "Initiating"], ["C", "Monitoring and controlling"], ["D", "Closing"], ["E", "Planning"]], "answer": "A", "answer_text": "A. Executing"}, {"n": 13, "q": "True or False: Each group of persons involved in the project should be assigned, and always needs to know their role and responsibility.", "options": [["A", "True"], ["B", "False"]], "answer": "A", "answer_text": "A. True"}, {"n": 14, "q": "Which one is not the causes of scope creep?", "options": [["A", "Decreased understanding of what is takes to get it done"], ["B", "Changing stakeholder perspectives"], ["C", "Poorly defined objectives"], ["D", "Inability to say \"NO\""], ["E", "Lack of defined change con- trol process"]], "answer": "D", "answer_text": "D. Inability to say \"NO\""}, {"n": 15, "q": "True or False: Project quality focuses on the project management processes used to meet project objec- tives.", "options": [["A", "False"], ["B", "True"]], "answer": "B", "answer_text": "B. True"}, {"n": 16, "q": "Lateral communication is NOT communication to/from:", "options": [["A", "Your customers."], ["B", "Your friends."], ["C", "Your subordinates."], ["D", "Your peers."]], "answer": "C", "answer_text": "C. Your subordinates."}, {"n": 17, "q": "True or False: In the context of a project, change is always a bad thing.", "options": [["A", "False"], ["B", "True"]], "answer": "A", "answer_text": "A. False"}, {"n": 18, "q": "Project scope differs from product scope in that:", "options": [["A", "Project scope completion is measured against the features, functions, and product requirements."], ["B", "Project scope is the work that needs to be accom-"], ["C", "Product scope completion is measured against the project management plan including all subsidiary plans."]], "answer": "B", "answer_text": "B. Project scope is the work that needs to be accom-"}, {"n": 19, "q": "Your project has a team of which consists of yourself, a tester, five developers and a communicator. How many communication channels on your team?", "options": [["A", "28"], ["B", "36"], ["C", "9"], ["D", "8"]], "answer": "A", "answer_text": "A. 28"}, {"n": 20, "q": "True or False: The Cost Baseline is equal to the total of Activity Cost Estimates plus contingency reserves", "options": [["A", "True"], ["B", "False"]], "answer": "A", "answer_text": "A. True"}, {"n": 21, "q": "True or False: The danger of estimating using the same parametric model is the no longer applicable of historical data", "options": [["A", "True"], ["B", "False"]], "answer": "A", "answer_text": "A. True"}, {"n": 22, "q": "All of the following are inputs to estimating activity duration except:", "options": [["A", "Enterprise Environmental Factor & Organizational Process Assets"], ["B", "Risk Register & Scope Statement"], ["C", "Project Documents Updates & Requirements Spec- ifications"], ["D", "Resource Calendars & Resource Breakdown Struc- ture"]], "answer": "C", "answer_text": "C. Project Documents Updates & Requirements Spec- ifications"}, {"n": 23, "q": "What are the 5 approaches to conflict discussed in the Project Human Resources Management Lesson?", "options": [["A", "Confronting, Compromising, Smoothing, Uninter- ested, Challenging."], ["B", "Communicating, Compromising, Smoothing, Forc- ing, Avoiding."], ["C", "Confronting, Challenging, Smoothing, Forcing, Avoiding."], ["D", "Confronting, Compromising, Smoothing, Forcing, Avoiding."]], "answer": "D", "answer_text": "D. Confronting, Compromising, Smoothing, Forcing, Avoiding."}, {"n": 24, "q": "As you plan your project, you do so thinking that all team members will be assigned to your project for at least 50% of their available time. This is an example of:", "options": [["A", "Wishful thinking."], ["B", "A project demand."], ["C", "An assumption."], ["D", "Poor planning."]], "answer": "C", "answer_text": "C. An assumption."}, {"n": 25, "q": "Which of the following is the most correct statement regarding management and contingency reserves?", "options": [["A", "Both of them are included into the cost budget of the project."], ["B", "Both of them are not included into the cost budget of the project."], ["C", "Management reserve is included into the cost bud- get but contingency reserve is not."], ["D", "Contingency reserve is included into the cost bud- get but management reserve is not."]], "answer": "D", "answer_text": "D. Contingency reserve is included into the cost bud- get but management reserve is not."}, {"n": 26, "q": "", "options": [["A", "Develop Project Charter All the following occur during the planning process group EXCEPT:"], ["B", "Create WBS"], ["C", "Estimate Costs"], ["D", "Sequence Activities"]], "answer": "A", "answer_text": "A. Develop Project Charter All the following occur during the planning process group EXCEPT:"}, {"n": 27, "q": "True or False: Influence means you have the right to apply resources, make decisions and give approvals.", "options": [["A", "True"], ["B", "False"]], "answer": "B", "answer_text": "B. False"}, {"n": 28, "q": "Which item would most likely NOT be part of a basic communication plan:", "options": [["A", "What they need to know."], ["B", "The best medium for the communication."], ["C", "The amount of their annual bonus."], ["D", "With whom to communicate."]], "answer": "C", "answer_text": "C. The amount of their annual bonus."}, {"n": 29, "q": "To calculate late start (LS) of an activity, you will", "options": [["A", "Take its late finish minus its estimated duration."], ["B", "Take its early finish minus its estimated duration."], ["C", "Take its early start plus its estimated duration."], ["D", "Take its early start"]], "answer": "A", "answer_text": "A. Take its late finish minus its estimated duration."}, {"n": 30, "q": "Which of the components below do you think NOT belong in the cost management plan?", "options": [["A", "Units of measure"], ["B", "Earned value rules"], ["C", "Control thresholds"], ["D", "RACI matrix"]], "answer": "D", "answer_text": "D. RACI matrix"}, {"n": 31, "q": "", "options": [["A", "True True or False: Conflict management is the process by which the project manager uses appropriate manage- rial techniques to deal with the inevitable disagree- ments that develop among those working toward pro- ject accomplishment."], ["B", "False"]], "answer": "A", "answer_text": "A. True True or False: Conflict management is the process by which the project manager uses appropriate manage- rial techniques to deal with the inevitable disagree- ments that develop among those working toward pro- ject accomplishment."}, {"n": 32, "q": "You are scheduling an activity which involves a gov- ernment agency. What type of dependency are you working on?", "options": [["A", "Discretionary"], ["B", "Internal"], ["C", "Mandatory"], ["D", "External"]], "answer": "D", "answer_text": "D. External"}, {"n": 33, "q": "True or False: Project Human Resource Management includes the processes that organize, manage, and lead the project team.", "options": [["A", "True"], ["B", "False"]], "answer": "A", "answer_text": "A. True"}, {"n": 34, "q": "A project manager can defend against scope creep with a good ___________!", "options": [["A", "Risk management plan"], ["B", "Change control process"], ["C", "Project management plan"], ["D", "Procurement process"]], "answer": "B", "answer_text": "B. Change control process"}, {"n": 35, "q": "Your stakeholder register is your primary output and should at least contain:", "options": [["A", "Assessment informa- tion, identification infor- mation, and stakeholder classification"], ["B", "Assessment information, identification informa- tion, and risk classification"], ["C", "Job descriptions, identification information, and stakeholder classification"], ["D", "Assessment information, scope information, and stakeholder classification"]], "answer": "A", "answer_text": "A. Assessment informa- tion, identification infor- mation, and stakeholder classification"}, {"n": 36, "q": "Once you and your team identify and assess risks and develop responses you:", "options": [["A", "Have completed your risk management responsi- bilities."], ["B", "Pay close attention to the risks identified and do not look for new risks."], ["C", "Only update your risk register when you are prepar- ing to share it with your stakeholders."], ["D", "Continue to identify and monitor risks for the re- mainder of the project."]], "answer": "D", "answer_text": "D. Continue to identify and monitor risks for the re- mainder of the project."}, {"n": 37, "q": "If \"review online modules\" needs to begin before \"de- velop online modules\" can finish, that is called a", "options": [["A", "Finish to start relationship."], ["B", "Start to finish relationship."], ["C", "Finish to finish relationship."], ["D", "Start to start relationship."]], "answer": "B", "answer_text": "B. Start to finish relationship."}, {"n": 38, "q": "True or False: The Project Sponsor is responsible for stakeholder expectations management.", "options": [["A", "False"], ["B", "True"]], "answer": "A", "answer_text": "A. False"}, {"n": 39, "q": "to manage a project effectively, work should be bro- ken down into small pieces. Which of the following does not describe how far to decompose the work?", "options": [["C", "Until it can be done by one person A, Until it has a meaningful conclusion"], ["B", "Until it cannot be logically subdivided further"], ["D", "Until it can be realistically estimated"]], "answer": "C", "answer_text": "C. Until it can be done by one person A, Until it has a meaningful conclusion"}, {"n": 40, "q": "What description defines Bottoms Up Estimating?", "options": [["A", "A technique that uses a mathematical model to estimate costs."], ["B", "A technique that analyzes activities on past projects and using them as a basis for estimating costs."], ["C", "A technique that involves estimating the cost of individual work packages or individual schedule activ- ities with the lowest level of detail."]], "answer": "C", "answer_text": "C. A technique that involves estimating the cost of individual work packages or individual schedule activ- ities with the lowest level of detail."}, {"n": 41, "q": "Which of the following action should not include in the Scope Management Plan?", "options": [["A", "Enable the creation and maintenance of the project work breakdown structure (WBS)."], ["B", "Define how format verification and acceptance of the completed project deliverables will be accom- plished."], ["C", "Control how requests for changes to the project scope will be processed."], ["D", "Prepare a project scope statement based upon the project charter."], ["E", "Define how to identify and manage triple con- straints."]], "answer": "E", "answer_text": "E. Define how to identify and manage triple con- straints."}, {"n": 42, "q": "The definition of a stakeholder includes:", "options": [["A", "People and organizations that are not impacted by your project."], ["B", "Organizations impacted by your project but not"], ["C", "The people or organi- zations that are positively or negatively impacted by your project. people, they are all part of the impacted organiza- tions."], ["D", "People who are impacted by your project, but not organizations impacted by your project."]], "answer": "C", "answer_text": "C. The people or organi- zations that are positively or negatively impacted by your project. people, they are all part of the impacted organiza- tions."}, {"n": 43, "q": "The purpose of project risk management is to:", "options": [["A", "Minimize the likelihood or the impact of positive events or threats to your project and to increase the likelihood or impact of negative events."], ["B", "Minimize the likelihood or the impact of negative events or threats to your project and to increase the likelihood or impact of positive events."], ["C", "Eliminate the likelihood or the impact of negative events or threats to your project and to decrease the likelihood or impact of positive events."], ["D", "Neutralize the likelihood or the impact of negative events or threats to your project and to neutralize the likelihood or impact of positive events."]], "answer": "B", "answer_text": "B. Minimize the likelihood or the impact of negative events or threats to your project and to increase the likelihood or impact of positive events."}, {"n": 44, "q": "Which element should NOT be included in risk man- agement plan?", "options": [["A", "Budgeting"], ["B", "Timing"], ["C", "Roles and Responsibilities"], ["D", "Risk Register"]], "answer": "D", "answer_text": "D. Risk Register"}, {"n": 45, "q": "An estimate created by looking at a similar project or activity and then adding or subtracting to or from the estimate based on the differences between the two is called:", "options": [["B", "Analogous estimating"], ["A", "Bottoms up estimating"], ["C", "Parametric estimating"], ["D", "Exact estimating"]], "answer": "B", "answer_text": "B. Analogous estimating"}, {"n": 46, "q": "As discussed in the Project Management course, The PMBOK® Guide describes 10 Project Management Knowledge Areas. Identify 3 out of the 10:", "options": [["A", "Stakeholder, Communication, Human Resource"], ["B", "Stakeholder, Vendor, Customer"], ["C", "Risk, Human Resource, Vendor"], ["D", "Procurement, Communication, Customer"]], "answer": "A", "answer_text": "A. Stakeholder, Communication, Human Resource"}, {"n": 47, "q": "You just came from a meeting with one of your project stakeholders, he knew well about your project and also its potential impacts, and actively engaged in ensuring that the project is a success. How would you classify him?", "options": [["A", "Supportive"], ["B", "Neutral"], ["C", "Unaware"], ["D", "Leading"]], "answer": "D", "answer_text": "D. Leading"}, {"n": 48, "q": "The best time to assign a project manager to a project is during:", "options": [["A", "Initiating"], ["B", "Planning"], ["C", "Executing"], ["D", "Integration"], ["E", "Project selection"]], "answer": "A", "answer_text": "A. Initiating"}, {"n": 49, "q": "True or False: Your role as the project manager during quality assurance is to implement the quality man-", "options": [["B", " s become false, it is bad news for the project. However, if constraints are false, it is good."]], "answer": "B", "answer_text": "B. Constraints are believed to be true, while assump- tions are true in nature."}, {"n": 192, "q": "If the response you choose is to exploit a risk this means that:", "options": [["A", "You actively do not consider the risk but establish contingency plan."], ["B", "You add steps to your plans to make certain the opportunity is captured"], ["C", "You change your plan so that another party will be responsible for a partial amount of ownership of the opportunity."], ["D", "You create your plan to increase the probability and/or the impact of the opportunity."]], "answer": "B", "answer_text": "B. You add steps to your plans to make certain the opportunity is captured"}, {"n": 193, "q": "One way to classify your stakeholders is to use the Power/Interest Grid. If a stakeholder is low interest / high power, what should the Project Manager do?", "options": [["A", "Monitor"], ["B", "Keep satisfied"], ["C", "Manage closely"], ["D", "Keep informed"]], "answer": "B", "answer_text": "B. Keep satisfied"}, {"n": 194, "q": "Your Cost Performance Index (CPI) is lesser than 1 means you are:", "options": [["A", "on budget."], ["B", "under budget."], ["C", "over budget."]], "answer": "C", "answer_text": "C. over budget."}, {"n": 195, "q": "You just came from a meeting with one of your project stakeholders, he knew about your project and was not against it, but did not seem to be particularly interest- ed in it either. How would you classify him?", "options": [["A", "Supportive"], ["B", "Neutral"], ["C", "Unaware"], ["D", "Resistant"]], "answer": "B", "answer_text": "B. Neutral"}, {"n": 196, "q": "Scope creep results in all of the followings, except:", "options": [["A", "Completion delays"], ["B", "Escalation of costs"], ["C", "Increases in project complexity"], ["D", "Decreases in project complexity"]], "answer": "D", "answer_text": "D. Decreases in project complexity"}, {"n": 197, "q": "Your team member informs you that the test system must be refreshed with your test data before testing can begin. This dependency is", "options": [["A", "Discretionary"], ["C", "Mandatory"], ["B", "Internal"], ["D", "External"]], "answer": "C", "answer_text": "C. Mandatory"}, {"n": 198, "q": "True or False: Earned value integrates schedule, bud- get and quality and uses monetary values to assess project status.", "options": [["A", "False"], ["B", "True"]], "answer": "A", "answer_text": "A. False"}, {"n": 199, "q": "If the response you choose is to mitigate a risk this means that:", "options": [["A", "You actively do not consider the risk but establish contingency plan."], ["B", "You change your plans so that you eliminate the risk."], ["C", "You change your plan so that another party will be responsible for the risk."], ["D", "You create your plan to reduce the probability and/or the impact of the risk."]], "answer": "D", "answer_text": "D. You create your plan to reduce the probability and/or the impact of the risk."}, {"n": 200, "q": "During a risk brainstorming session, a team member identifies a risk. This particular risk does not seem to belong to any of the categories in you Risk Breakdown Structure (RBS). How should you respond?", "options": [["A", "Chastise him for making up risks which cannot exist because there is not a category for such risks."], ["B", "Ignore him and move on to another risk identified by a different team member."], ["C", "Thank him for his work, but inform him that the risk cannot be included because it does not fit any of the categories defined in the RBS."], ["D", "Record the list in the risk register, discuss potential responses and make a note to update the RBS."]], "answer": "D", "answer_text": "D. Record the list in the risk register, discuss potential responses and make a note to update the RBS."}, {"n": 201, "q": "The WBS is used to derive all but one of the following:", "options": [["A", "The project schedule baseline"], ["B", "The business need for the project"], ["C", "The project cost performance baseline"], ["D", "The activity list"]], "answer": "B", "answer_text": "B. The business need for the project"}, {"n": 202, "q": "In Earned Value Management Technique, you can compute the Estimate At Completion (EAC) by apply- ing which of following formula? (Notes: BAC: Budget At Completion)", "options": [["A", "EAC = BAC + CPI"], ["B", "EAC = BAC / CP|"], ["C", "EAC = BAC - SPI"], ["D", "EAC = BAC * CPI"]], "answer": "B", "answer_text": "B. EAC = BAC / CP|"}, {"n": 203, "q": "Different estimating techniques serve different pur- pose, which of the following statements are correct (choose 2 answers)?", "options": [["A", "When activity duration or resource quantities are uncertain, use top-down estimating techniques."], ["B", "When detail is available and accuracy is needed, use bottom-up estimating techniques."], ["C", "When activity duration or resource quantities are uncertain, use bottom-up estimating techniques."], ["D", "When detail is available and accuracy is needed, use top-down estimating techniques."]], "answer": "A + B", "answer_text": "A. When activity duration or resource quantities are uncertain, use top-down estimating techniques. + B. When detail is available and accuracy is needed, use bottom-up estimating techniques."}, {"n": 204, "q": "An output of the Close Project or Close Phase process is the creation of:", "options": [["A", "Project archives"], ["B", "A project charter"], ["C", "A project management plan"], ["D", "A risk management plan"], ["E", "A communication plan"]], "answer": "A", "answer_text": "A. Project archives"}, {"n": 205, "q": "Which one of these situations most closely represents scope creep:", "options": [["A", "The project scope changes through the use of a formal change control process."], ["B", "The project scope was used to create a WBS that was used to create estimates and a schedule."], ["C", "The project scope keeps changing and team mem- bers are not sure why and the project seems like it will never end."], ["D", "The scope of the project is clearly agreed upon by the key project stakeholders."]], "answer": "C", "answer_text": "C. The project scope keeps changing and team mem- bers are not sure why and the project seems like it will never end."}, {"n": 206, "q": "True or False: You should compare your project perfor- mance against the performance measurement base- line to look for potential changes in the project.", "options": [["A", "True"], ["B", "False"]], "answer": "A", "answer_text": "A. True"}, {"n": 207, "q": "A good change process will:", "options": [["A", "Require the same level of approval for all changes."], ["B", "Have change thresholds that are appropriate for the type of change."], ["C", "Be very complex in order to discourage changes."], ["D", "Allow the project manager to approve all changes."]], "answer": "B", "answer_text": "B. Have change thresholds that are appropriate for the type of change."}, {"n": 208, "q": "True or False: A Work Breakdown Structure (WBS) is a deliverable-oriented hierarchical decomposition of A the work to be executed just by the Project Manager.", "options": [["A", "False"], ["B", "True"]], "answer": "A", "answer_text": "A. False"}, {"n": 209, "q": "A significant event in a project that may indicate com- pletion of a major phase is a/an:", "options": [["A", "Activity"], ["B", "Milestone"], ["C", "Work package"], ["D", "Deliverable"]], "answer": "B", "answer_text": "B. Milestone"}, {"n": 210, "q": "If \"review online modules\" needs to begin before \"de- velop online modules\" can finish, that is called a:", "options": [["A", "Finish to start relationship."], ["B", "Start to finish relationship."], ["C", "Finish to finish relationship."], ["D", "Start to start relationship."]], "answer": "B", "answer_text": "B. Start to finish relationship."}, {"n": 211, "q": "To calculate late finish (LF) and late start (LS) perform a:", "options": [["A", "Critical pass"], ["B", "Backward pass"], ["C", "Forward pass"], ["D", "Lateral pass"]], "answer": "B", "answer_text": "B. Backward pass"}, {"n": 212, "q": "The following table is an activity list that includes the duration and predecessor for a series of project activities. What is the duration of the critical path?", "options": [["A", "11"], ["B", "13"], ["C", "14"], ["D", "9"]], "answer": "C", "answer_text": "C. 14"}, {"n": 213, "q": "Once the logic of a network is laid out, the project manager will conduct a forward pass and a backward pass through the network. This will provide informa- tion regarding ______ and will identify the ______.", "options": [["A", "Resource shortages, high risk activities"], ["B", "The total duration of the project, critical path"], ["C", "The slack for each activity, high risk activities"], ["D", "The high risk activities, non-critical path"]], "answer": "B", "answer_text": "B. The total duration of the project, critical path"}, {"n": 214, "q": "True or False: Your project might pay more in order to reduce the schedule when using Fast Tracking approach, but that is not often true if using Crashing approach.", "options": [["A", "True"], ["B", "False"]], "answer": "B", "answer_text": "B. False"}, {"n": 215, "q": "A past project took 20,000 hours to complete. Your new project is adding some additional scope and that cope is estimated to take 10,000 additional hours. There is some work that was completed in the previ- ous project that will not be completed in this project. That work is estimated at 5,000 hours. Labor rates have increased 10%, the old rate was $25 per hour. Your estimate for the new project is $687,500. Which estimating method is used?", "options": [["A", "Parametric estimating"], ["B", "Analogous estimating"], ["C", "Bottom-up estimating"], ["D", "Three-point estimating"]], "answer": "C", "answer_text": "C. Bottom-up estimating"}, {"n": 216, "q": "True or False: Using bottom-up estimating techniques when activity durations or resource quantities are un- certain.", "options": [["A", "True"], ["B", "False"]], "answer": "B", "answer_text": "B. False"}, {"n": 217, "q": "True or False: The Project Budget is equal to the Cost Baseline budget plus Management Reserve.", "options": [["A", "True"], ["B", "False"]], "answer": "A", "answer_text": "A. True"}, {"n": 218, "q": "True or False: Earned value integrates budget, quality and scope and uses monetary values to assess project status.", "options": [["A", "False"], ["B", "True"]], "answer": "A", "answer_text": "A. False"}, {"n": 219, "q": "True or False: Quality management is the job done by project manager himself/herself to determine quality policies, objectives, and responsibilities so that the project will satisfy the needs for which it was under- taken", "options": [["A", "False"], ["B", "True"]], "answer": "A", "answer_text": "A. False"}, {"n": 220, "q": "True or False: Product quality focuses on the goods and services.", "options": [["A", "False"], ["B", "True"]], "answer": "B", "answer_text": "B. True"}, {"n": 221, "q": "True or False: Performing quality assurance within the context of a project involves taking actions to elimi- nate causes of unsatisfactory project performance.", "options": [["A", "False"], ["B", "True"]], "answer": "A", "answer_text": "A. False"}, {"n": 222, "q": "True or False: Project Human Resource Management includes the processes that organize, manage, and lead the project team.", "options": [["A", "False"], ["B", "True"]], "answer": "B", "answer_text": "B. True"}, {"n": 223, "q": "Which one of these should be the view of conflict?", "options": [["A", "Caused by troublemakers"], ["B", "Often beneficial"], ["C", "Should be avoided"], ["D", "Must be suppressed"]], "answer": "B", "answer_text": "B. Often beneficial"}, {"n": 224, "q": "True or False: Each person involved in the project should be assigned, but doesn't always need to know his or her role and responsibility.", "options": [["A", "True"], ["B", "False"]], "answer": "B", "answer_text": "B. False"}, {"n": 225, "q": "When you use the RACI or Responsible, Accountable, Consult, Inform version of the RAM, those responsible persons are:", "options": [["A", "Providing subject matter expertise"], ["B", "Supervising the work"], ["C", "Not completing the work"], ["D", "Completing the work"]], "answer": "D", "answer_text": "D. Completing the work"}, {"n": 226, "q": "True or false, a project manager spend most of his/her time communicating", "options": [["A", "False"], ["B", "True"]], "answer": "B", "answer_text": "B. True"}, {"n": 227, "q": "Who should take the most responsibility for clear and effective communication?", "options": [["A", "The Communications Manager"], ["B", "The receiver"], ["C", "The sender and the receiver"], ["D", "The sender"]], "answer": "C", "answer_text": "C. The sender and the receiver"}, {"n": 228, "q": "True or False: The primary goal of project risk manage- ment is to maximize the likelihood and impact of neg- ative events or threats and to minimize the likelihood and impact of positive events or opportunities", "options": [["A", "False"], ["B", "True"]], "answer": "A", "answer_text": "A. False"}, {"n": 229, "q": "If the response you choose is to enhance a risk this means that:", "options": [["A", "You actively do not consider the risk but establish contingency plan."], ["B", "You add steps to your plans to make certain the opportunity is captured."], ["C", "You change your plan so that another party will be responsible for a partial amount of ownership of the opportunity"], ["D", "You create your plan to increase the probability and/or the impact of the opportunity."]], "answer": "D", "answer_text": "D. You create your plan to increase the probability and/or the impact of the opportunity."}, {"n": 230, "q": "Who is the stakeholder that will timately use the prod- uct or service you are creating?", "options": [["A", "Project Team"], ["B", "Project Manager"], ["C", "Customer/User"], ["D", "Sponsor"]], "answer": "C", "answer_text": "C. Customer/User"}, {"n": 231, "q": "If a difficult stakeholder has low interest and low pow- er then as the project manager you:", "options": [["A", "Can try to move them to be high interest and high power so that they are happy and do not get in your way."], ["B", "Can try to move them to be high interest and low power so they do not get in your way."], ["C", "Can monitor them, but do not bore them with ex- cessive communication."], ["D", "Can ignore them, they are as you need them to be."]], "answer": "C", "answer_text": "C. Can monitor them, but do not bore them with ex- cessive communication."}, {"n": 232, "q": "True or False: The Project Manager is responsible for stakeholder expectations management", "options": [["A", "False"], ["B", "True"]], "answer": "B", "answer_text": "B. True"}, {"n": 233, "q": "A project manager's primary responsibility is to de- liver the product of the project within project con- straints. Actions taken and changes made to the benefit of one constraint could negatively affect another. Which of the following best describes the major constraints on a project?", "options": [["A", "Scope, number of resources, and cost"], ["B", "Scope, cost, and schedule"], ["C", "Scope, schedule, cost, quality, risk, resources, and customer satisfaction"], ["D", "Schedule, cost, and number of changes"]], "answer": "C", "answer_text": "C. Scope, schedule, cost, quality, risk, resources, and customer satisfaction"}, {"n": 234, "q": "True or False: The Project Charter is a document is- sued by the project initiator or sponsor that formally authorizes the existence of a project. It provides the B project manager with the authority to apply organiza- tional resources to project activities.", "options": [["A", "False"], ["B", "True"]], "answer": "B", "answer_text": "B. True"}, {"n": 235, "q": "True or False: Effective project communication man- agement creates a bridge between stakeholders based or a shared understanding o xt": "A. True"}, {"n": 246, "q": "A cost can be either variable or fixed. Which of the following statements are correct (choose 2 answers)?", "options": [["A", "Variable costs: These costs change with the amount of production. Examples include the cost of material, supplies, and wages"], ["B", "Fixed costs: These costs do not change as produc- tion changes. Examples include the cost of setup, rent, utilities, etc."], ["C", "Fixed costs: These costs change with the amount of production. Examples include the cost of material, supplies, and wages."], ["D", "Variable costs: These costs do not change as pro- duction changes. Examples include the cost of setup, rent, utilities, etc. A"]], "answer": "A + B", "answer_text": "A. Variable costs: These costs change with the amount of production. Examples include the cost of material, supplies, and wages + B. Fixed costs: These costs do not change as produc- tion changes. Examples include the cost of setup, rent, utilities, etc."}, {"n": 247, "q": "Which one of these most correctly defines contin- gency reserve?", "options": [["A", "Per our lesson, management reserve and contin- gency are exactly the same."], ["B", "Contingency reserve is not tied to any specific work packages nor activities."], ["C", "Contingency reserve is tied to specific work pack- ages or activities."], ["D", "Contingency reserve is tied to only one specific milestone."]], "answer": "C", "answer_text": "C. Contingency reserve is tied to specific work pack- ages or activities."}, {"n": 248, "q": "Eared value management integrates scope, cost, and schedule measures to:", "options": [["A", "assess communication effectiveness among project team members."], ["B", "assess whether all requirements were met"], ["C", "develop a preliminary budget."], ["D", "assess project performance and progress."]], "answer": "D", "answer_text": "D. assess project performance and progress."}, {"n": 249, "q": "True or False: Your role as the project manager during quality assuranc ives."]], "answer": "B", "answer_text": "B. Changes with impacts on cost or time will be elevat- ed to the Change Control Board."}, {"n": 266, "q": "One way to classify your stakeholders is to use the Power/Interest Grid. If a stakeholder is low interest / low power, what should the Project Manager do?", "options": [["A", "Manage closely"], ["B", "Keep informed"], ["C", "Keep satisfied"], ["D", "Monitor"]], "answer": "D", "answer_text": "D. Monitor"}, {"n": 267, "q": "True or False: Earned value integrates scope, schedule and budget and uses monetary values to assess pro- ject status.", "options": [["A", "False"], ["B", "True"]], "answer": "B", "answer_text": "B. True"}, {"n": 268, "q": "You just came from a meeting with one of your project stakeholders, he knew about your project and also its potential impacts, and he always supported for the work and its outcomes. How would you classify him?", "options": [["A", "Supportive"], ["B", "Neutral"], ["C", "Unaware"], ["D", "Leading"]], "answer": "A", "answer_text": "A. Supportive"}, {"n": 269, "q": "You and another project manager disagree over whether a team member should work on your team or on her leam. You decide that the team member can work for the other project manager in the afternoon and the other project manager says it is OK for the team member to work for you in the morning. The truth is you both wanted this person fulltime. The conflict resolution approach you have both used is:", "options": [["A", "Compromising"], ["B", "Smoothing"], ["C", "Confronting"], ["D", "Forcing"]], "answer": "A", "answer_text": "A. Compromising"}, {"n": 270, "q": "The discipline of quality management complements the discipline of project management. Both recognize all but one of the following", "options": [["A", "Customer satisfaction"], ["B", "Prevention over inspection"], ["C", "Continuous improvement"], ["D", "Project team responsibility"]], "answer": "D", "answer_text": "D. Project team responsibility"}, {"n": 271, "q": "True or False: A Project is defined as being unique and temporary, with an undefined start and finish.", "options": [["A", "True"], ["B", "False"]], "answer": "B", "answer_text": "B. False"}, {"n": 272, "q": "A The person who should be in control of the project during project planning is the", "options": [["A", "Project manager"], ["B", "Team member"], ["C", "Functional manager"], ["D", "Sponsor"]], "answer": "A", "answer_text": "A. Project manager"}, {"n": 273, "q": "During a project team meeting, a team member sug- gests an enhancement to the scope that is beyond the cope of the project charter. The project manager points out that the team needs to concentrate on completing all the work and only the work required. This is an example of:", "options": [["A", "Change management"], ["B", "Scope management"], ["C", "Quality analysis"], ["D", "Scope decomposition"]], "answer": "B", "answer_text": "B. Scope management"}, {"n": 274, "q": "Given Tm is the most likely of the estimated duration of the activity, To is the optimistic value and Tp is the pessimistic one. The PERT (Program Evaluation and Review Technique) analysis calculates the expected activity duration (Te) using which of the weighted av- erage of these three estimates?", "options": [["A", "Te = (Tm + 4*To + Tp)/6 В. Te = (To + 4*Tp + Tm)/6 С. Te = (Tp + 4*Tm + To)/6"], ["D", "Te = (Tm + To + Tp)/3"]], "answer": "C", "answer_text": "C"}, {"n": 275, "q": "In Earned Value Management Technique, you can compute the Schedule Variance (SV) by applying which of following formula?", "options": [["A", "SV = EV / PV"], ["B", "SV = EV - AC"], ["C", "SV = EV - PV"], ["D", "SV = EV / AC"]], "answer": "C", "answer_text": "C. SV = EV - PV"}, {"n": 276, "q": "A project manager has received some help from the team, and she needs help from them again so that she can create a detailed project budget. Which project management process group is she in?", "options": [["A", "Initiating"], ["B", "Planning"], ["C", "Executing"], ["D", "Monitoring and controlling"], ["E", "Closing"]], "answer": "B", "answer_text": "B. Planning"}, {"n": 277, "q": "You have a project to build a new fence. The fence will form a square. Each side is to take one day to build, and $1,000 has been budgeted per side. The sides are planned to be completed one after the other. Today is the end of day 3. Using the following project status chart to calculate project current BAC.", "options": [["A", "BAC = $2,500"], ["B", "BAC = $3,100"], ["C", "BAC = $3,250"], ["D", "BAC = $4,000"], ["E", "BAC = $3,000"], ["F", "BAC = $2,200"]], "answer": "D", "answer_text": "D. BAC = $4,000"}, {"n": 278, "q": "True or False: When you choose to transfer your pro- ject risk to a third party, it may give rise to that did not exist prior to the transfer.", "options": [["A", "True"], ["B", "False"]], "answer": "A", "answer_text": "A. True"}, {"n": 279, "q": "True or False: It should not to add extra cost to the es- timates when you are concerned that your estimates might not be correct, especially if you think they are too low.", "options": [["A", "True"], ["B", "False"]], "answer": "B", "answer_text": "B. False"}];
let deck=[...QUESTIONS], index=0, flipped=false;
const card=document.getElementById('card'), question=document.getElementById('question'), options=document.getElementById('options'), answer=document.getElementById('answer'), qnum=document.getElementById('qnum'), counter=document.getElementById('counter'), bar=document.getElementById('bar'), search=document.getElementById('search');
function render(){
 if(!deck.length){qnum.textContent='Không có kết quả';question.textContent='Không tìm thấy câu phù hợp.';options.innerHTML='';answer.textContent='';counter.textContent='';bar.style.width='0';return;}
 const item=deck[index]; qnum.textContent=`Question ${item.n}`; question.textContent=item.q;
 options.innerHTML=item.options.map(([l,v])=>`<div class="option"><b>${l}.</b> ${v}</div>`).join('');
 answer.textContent=item.answer_text; counter.textContent=`${index+1} / ${deck.length}`; bar.style.width=`${((index+1)/deck.length)*100}%`; card.classList.toggle('flipped',flipped);
}
function flip(){if(deck.length){flipped=!flipped;card.classList.toggle('flipped',flipped)}}
function next(){if(!deck.length)return;index=(index+1)%deck.length;flipped=false;render()}
function prev(){if(!deck.length)return;index=(index-1+deck.length)%deck.length;flipped=false;render()}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}index=0;flipped=false;render()}
card.onclick=flip; document.getElementById('flip').onclick=flip; document.getElementById('next').onclick=next; document.getElementById('prev').onclick=prev; document.getElementById('shuffle').onclick=shuffle;
document.getElementById('reset').onclick=()=>{deck=[...QUESTIONS];index=0;flipped=false;search.value='';render()};
document.getElementById('print').onclick=()=>window.print();
search.addEventListener('input',e=>{const term=e.target.value.toLowerCase().trim();deck=QUESTIONS.filter(x=>(x.q+' '+x.options.map(o=>o.join(' ')).join(' ')).toLowerCase().includes(term));index=0;flipped=false;render()});
document.addEventListener('keydown',e=>{if(e.target===search)return;if(e.code==='Space'){e.preventDefault();flip()}else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev()});
render();
</script>
